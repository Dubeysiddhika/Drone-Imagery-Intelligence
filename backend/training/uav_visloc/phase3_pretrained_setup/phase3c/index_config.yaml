dataset_root: "../../../../../UAV_VisLoc_dataset"
phase1_metadata: "../../phase1_validation/outputs/consolidated_drone_metadata.csv"
phase2_tile_metadata: "../../phase2_pair_preparation/satellite_tile_metadata.csv"
tile_metadata: "satellite_tile_metadata.csv"
satellite_tiles: "satellite_tiles"
global_features: "global_features"
local_features: "local_features"
index_metadata: "metadata"
reports: "reports"

tiling:
  size_px: 512
  overlap_fraction: 0.20
  image_format: "JPEG"
  jpeg_quality: 95

dinov2:
  repository: "facebookresearch/dinov2"
  entrypoint: "dinov2_vits14"
  model_version: "dinov2_vits14_pretrain"
  input_size_px: 224
  descriptor_dim: 384
  shard_size: 64
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

superpoint:
  model_version: "superpoint_v1"
  max_num_keypoints: 512
  detection_threshold: 0.0005
  input_max_side_px: 512
  shard_size: 64

inference:
  device: "cpu"
  cpu_threads: 4
  minimum_available_ram_gb: 0.5
  retrieval_top_k: 5
